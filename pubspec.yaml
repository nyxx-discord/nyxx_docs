name: nyxx_docs
description: A documentation site built with Jaspr
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  jaspr: ^0.22.3
  jaspr_content: ^0.4.4
  jaspr_router: ^0.8.0
  jaspr_cli: ^0.22.3
  jaspr_og:
    hosted: https://pub.lexedia.moe
    version: ^0.0.1-dev.5

dev_dependencies:
  build_runner: ^2.11.1
  build_web_compilers: ^4.4.12
  jaspr_builder: ^0.22.3
  jaspr_lints: ^0.6.0
  lints: ^6.0.0

jaspr:
  mode: static
